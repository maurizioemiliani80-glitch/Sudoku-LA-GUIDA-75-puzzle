<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarica i Puzzle Sudoku Bonus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        iframe {
            width: 100%;
            border: none;
            border-radius: 6px;
        }
        
        .info {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Puzzle Sudoku Bonus</h1>
        <p class="subtitle">Scarica gratuitamente i puzzle aggiuntivi per continuare a giocare</p>
        
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfXe7Dw0DorT9sGf0nuPqyA3mO-6tfPicSiY-jaXVVeo9fcoQ/viewform?usp=publish-editor" height="600" frameborder="0" marginheight="0" marginwidth="0">Caricamento…</iframe>
        
        <div class="info">
            ℹ️ La tua email verrà utilizzata solo per consentirti il download. Nessuno spam!
        </div>
    </div>
</body>
</html>
